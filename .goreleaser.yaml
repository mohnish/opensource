# GoReleaser configuration.
# Docs: https://goreleaser.com
#
# Push a semver tag (e.g. v3.0.0) to build release archives, sign and notarize
# the macOS binaries, publish a GitHub Release, and update Casks/opensource.rb
# in mohnish/homebrew-opensource. See README.md for the required repository secrets.
version: 2

project_name: opensource

builds:
  - id: opensource
    main: .
    binary: opensource
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

notarize:
  macos:
    - enabled: true
      ids:
        - opensource
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: default
    ids:
      - opensource
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - name: opensource
    ids:
      - default
    repository:
      owner: mohnish
      name: homebrew-opensource
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/mohnish/opensource"
    description: "Command line tool that adds an open source license to your project"
    license: MIT
    binaries:
      - opensource
    skip_upload: auto
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "Release {{ .ProjectName }} {{ .Tag }}"

release:
  name_template: "{{ .Tag }}"
  prerelease: auto
  github:
    owner: mohnish
    name: opensource
